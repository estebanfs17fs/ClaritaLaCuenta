name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del parser
        run: ./gradlew :parser:test

      - name: Compilar APK
        run: ./gradlew :app:assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk gastos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gastos-apk
          path: gastos.apk

      - name: Publicar versión para descargar desde el celular
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gastos 1.0.${{ github.run_number }}
          files: gastos.apk
          make_latest: true
